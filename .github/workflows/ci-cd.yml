name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: python -m pip install --upgrade pip-tools==7.6.1 pip-audit==2.10.1

      - name: Verify lock file is current
        run: |
          pip-compile --cache-dir .pip-tools-cache --generate-hashes --strip-extras --no-header --output-file requirements.lock requirements.in
          git diff --exit-code requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit locked dependencies
        run: pip-audit --cache-dir .pip-audit-cache -r requirements.lock

      - name: Compile Python files
        run: python -m py_compile src/agent.py src/genai_semconv.py scripts/smoke_import.py scripts/test_sanitize_resources.py scripts/test_ask_incident.py eval_judge.py

      - name: Import smoke test
        run: python scripts/smoke_import.py

      - name: Sanitizer resource-name regression test
        run: python scripts/test_sanitize_resources.py

      - name: Ask-incident endpoint regression test
        run: python scripts/test_ask_incident.py

  docker:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ai-agent"
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:sha-${short_sha}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${tags}"$'\n'"${image}:main"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${image}:${GITHUB_REF_NAME}"
          fi

          {
            echo "image=${image}"
            echo "tag=sha-${short_sha}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          # GITOPS_REPO 沒設 repo variable 時,預設用同一個 GitHub 帳號底下的
          # platform-gitops(跟這份 repo 同 owner),讓 fork 的人不用先設變數就能跑。
          repository: ${{ vars.GITOPS_REPO || format('{0}/platform-gitops', github.repository_owner) }}
          ref: main
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: platform-gitops

      - name: Update GitOps image tag and agent version
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          AGENT_VERSION: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          file="platform-gitops/apps/ai-agent.yaml"
          perl -0pi -e 's#image:\s*ghcr\.io/[^\s]+/ai-agent:\S+#image: '"${IMAGE}"'#' "${file}"
          perl -0pi -e 's#name:\s*AGENT_VERSION,\s*value:\s*"[^"]+"#name: AGENT_VERSION,    value: "'"${AGENT_VERSION}"'"#' "${file}"

          if ! grep -q "image: ${IMAGE}" "${file}"; then
            echo "Failed to update ${file}" >&2
            exit 1
          fi
          if ! grep -q "name: AGENT_VERSION,    value: \"${AGENT_VERSION}\"" "${file}"; then
            echo "Failed to update AGENT_VERSION in ${file}" >&2
            exit 1
          fi

          cd platform-gitops
          if git diff --quiet -- apps/ai-agent.yaml; then
            echo "GitOps image and AGENT_VERSION already ${IMAGE}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ai-agent.yaml
          git commit -m "Deploy ai-agent ${GITHUB_SHA::12}"
          git push origin HEAD:main
